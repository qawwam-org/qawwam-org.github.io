/* =====================================================================
   qawwam FLIP ENGINE (shared by every Flip card)

   The template ("kulit") supplies the faces, its fonts and 4 palettes;

/* ---------- page: one screen, no scroll ---------- */
.pentas {

/* ---------- the card ---------- */
.kad {
  --nisbah: 1.4;                       /* height / width (5 × 7 inch) */
  --lebar: min(95cqw, calc(92cqh / var(--nisbah)), 420px);
  --min-kecil: 9px;                    /* reading floors for the inside: body copy, */
  --min-sedang: 10px;                  /* time and parents, */
  --min-besar: 11.5px;                 /* venue and the couple's full names */
  --u: calc(var(--lebar) / 100);
  --tebal: max(2px, calc(var(--u) * .7));   /* card stock thickness */
  position: relative; width: var(--lebar); height: calc(var(--lebar) * var(--nisbah));
  margin-bottom: 2cqh;
  perspective: calc(var(--lebar) * 4.2); cursor: pointer; touch-action: pan-y pinch-zoom;
  -webkit-user-select: none; user-select: none;
  animation: kad-masuk 1s cubic-bezier(.2, .7, .2, 1) both;
}
@supports not (width: 1cqw) {
  .kad { --lebar: min(calc(100vw - 40px), calc((100vh - 190px) / var(--nisbah)), 420px); }
}
@keyframes kad-masuk { from { opacity: 0; transform: translateY(22px); } }

.bayang {
  position: absolute; left: 7%; right: 7%; bottom: -4.2%; height: 9%; border-radius: 50%;

.bayang.lompat { animation: bayang-lompat .95s ease-in-out; }

.angkat.lompat { animation: angkat-lompat .95s cubic-bezier(.45, .05, .2, 1); }
.angkat.intai { animation: angkat-intai 1.4s cubic-bezier(.45, .05, .2, 1); }
@keyframes angkat-lompat { 50% { transform: translateY(-2.4%) scale(1.04); } }
@keyframes angkat-intai { 30% { transform: rotateY(-22deg) rotateX(2deg); } 62% { transform: rotateY(6deg); } 84% { transform: rotateY(-1.5deg); } }
.putar { transform: rotateY(var(--sudut, 0deg)); transition: transform .95s cubic-bezier(.45, .05, .2, 1); }
.putar.seret { transition: none; }

/* faces sit half the card thickness in front of / behind the centre plane */
.muka {
  position: absolute; inset: 0; overflow: hidden;
  border-radius: calc(var(--u) * var(--bucu, 1.2));
  -webkit-backface-visibility: hidden; backface-visibility: hidden;

  box-shadow: 0 calc(var(--u) * 4.5) calc(var(--u) * 9) calc(var(--u) * -5) var(--bayang),
              0 calc(var(--u) * .6) calc(var(--u) * 1.4) calc(var(--u) * -.4) rgba(0, 0, 0, .18);
}
.muka.belakang { transform: rotateY(180deg) translateZ(calc(var(--tebal) / 2)); }
/* die-cut shapes: arch (gerbang) and pointed mihrab; the shadow then comes from .bayang alone */
.kad[data-bentuk="gerbang"] .muka { clip-path: url(#qw-bentuk-gerbang); border-radius: 0; box-shadow: none; }
.kad[data-bentuk="mihrab"] .muka { clip-path: url(#qw-bentuk-mihrab); border-radius: 0; box-shadow: none; }

.tepi {
  position: absolute; top: calc(var(--u) * var(--bucu, 1.2)); bottom: calc(var(--u) * var(--bucu, 1.2));

    c.globalAlpha = .45; c.lineWidth = Math.max(.8, w * .004); c.beginPath(); c.moveTo(x - m * 2.2, yy + h + m); c.lineTo(x - m * 2.2, yy + r); c.arc(x + r, yy + r, r + m * 2.2, Math.PI, 0); c.lineTo(x + w + m * 2.2, yy + h + m); c.stroke();

      c.fillStyle = P.lambang[2]; c.font = "italic 400 17px 'EB Garamond', Georgia, serif"; c.textAlign = "center"; c.fillText(`${inisial[0]}·${inisial[1]}`, 0, 5.5);

/* =====================================================================
   qawwam FLIP ENGINE · script
   Reads CONFIG (same shape as every qawwam card) and KULIT (the template:
   its 4 palettes and optional hooks), fills the card, flips it, fits text.
   KULIT hooks (all optional):
     isi(F, CONFIG)      add or change text fields before they are filled
     lukis(ctx)          draw art that needs JS; called again after a colour change
                         ctx = { root, kad, warna, css(name), u }
     selepasMuat()       after text fitting
   ===================================================================== */
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const root = document.documentElement;
  const K = window.KULIT || {};
  const C = (typeof CONFIG !== "undefined" && CONFIG) || {};
  const kurang = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const HARI = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
  const BULAN = ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai", "Ogos", "September", "Oktober", "November", "Disember"];
  const ROM = (n) => { let r = "", x = n; [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]].forEach(([v, s]) => { while (x >= v) { r += s; x -= v; } }); return r; };
  const dua = (n) => String(n).padStart(2, "0");

  /* ---------- 1. text fields ---------- */
  const A = C.anak || {}, B = C.pasangan || {}, L = C.lokasi || {};
  const iso = String(C.mula || "2026-12-12T11:00:00+08:00");
  const [y, m, d] = iso.slice(0, 10).split("-").map(Number);
  const hari = HARI[new Date(Date.UTC(y, (m || 1) - 1, d || 1)).getUTCDay()] || "";
  const tuan = (C.tuanRumah || []).filter(Boolean);
  const kawasan = (() => { const mm = String(L.alamat || "").match(/\b\d{5}\s+([^,]+)/); return mm ? mm[1].trim() : ""; })();
  const awal = (s) => (String(s || "").trim().charAt(0) || "").toUpperCase();
  const F = {
    tajuk: C.tajuk || "Walimatul Urus",
    a: A.panggilan || "", b: B.panggilan || "", aN: A.penuh || "", bN: B.penuh || "",
    ai: awal(A.panggilan), bi: awal(B.panggilan),
    tuan: tuan.join(" & "), tuan1: tuan[0] || "", tuan2: tuan[1] || "",
    hubungan: C.hubungan || "puteri",
    hari, hariB: hari.toUpperCase(),
    tgl: String(d || ""), tgl2: dua(d || 0), bln: BULAN[(m || 1) - 1] || "", blnP: (BULAN[(m || 1) - 1] || "").slice(0, 3),
    bln2: dua(m || 0), thn: String(y || ""),
    tarikh: `${dua(d)} · ${dua(m)} · ${y}`, tarikhTitik: `${dua(d)}.${dua(m)}.${y}`,
    tarikhPanjang: `${hari}, ${d} ${BULAN[(m || 1) - 1]} ${y}`, tarikhSederhana: `${d} ${BULAN[(m || 1) - 1]} ${y}`,
    rumawi: `${ROM(d || 1)} · ${ROM(m || 1)} · ${ROM(y || 2026)}`, thnRom: ROM(y || 2026),
    hijri: C.hijri || "", masa: C.masa || "",
    tempat: L.nama || "", alamat: L.alamat || "", kawasan,
    edisi: `${dua(d)}${dua(m)}`

  if (typeof K.isi === "function") { try { K.isi(F, C); } catch (e) { console.warn(e); } }
  $$("[data-f]").forEach((el) => { const k = el.getAttribute("data-f"); if (k in F) el.textContent = F[k]; });
  const BILA = { bismillah: C.bismillah !== false, hijri: !!F.hijri, masa: !!F.masa, alamat: !!F.alamat, tuan: !!F.tuan, tuan2: !!F.tuan2, tempat: !!F.tempat };
  $$("[data-bila]").forEach((el) => { const k = el.getAttribute("data-bila"); if (k in BILA) el.hidden = !BILA[k]; });
  const peta = L.gmapsUrl || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([L.nama, L.alamat].filter(Boolean).join(", "));
  $$("a[data-peta]").forEach((a) => { a.href = peta; a.target = "_blank"; a.rel = "noopener"; });
  const J = C.jenama || {};
  const jen = $("#jenama");
  if (jen) {
    jen.href = J.url || "https://qawwam-org.github.io";
    const n = $("#jenama-nama"); if (n) n.textContent = J.nama || "qawwam";
    const h = $("#jenama-harga"); if (h) h.textContent = J.harga || "RM4.90";
  }

  /* ---------- 2. palettes ---------- */
  const WARNA = K.warna || [];
  let warnaKini = "";
  function setWarna(kunci, tanpaLukis) {
    const w = WARNA.find((x) => x.key === kunci) || WARNA[0];
    if (!w) return;
    warnaKini = w.key;
    root.setAttribute("data-warna", w.key);
    const dw = $("#warna");
    if (dw) $$("button", dw).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.warna === w.key)));

  }
  function css(nama) { return getComputedStyle(root).getPropertyValue(nama).trim(); }
  function lukis() {
    if (typeof K.lukis !== "function") return;
    const kad = $("#kad");
    const u = kad ? kad.offsetWidth / 100 : 4;
    try { K.lukis({ root, kad, warna: warnaKini, css, u }); } catch (e) { console.warn(e); }
  }
  setWarna(C.gaya, true);

  /* ---------- 3. flip ---------- */
  const kad = $("#kad"), putar = $("#putar"), angkat = $("#angkat"), bayang = $("#bayang");
  const depan = $("#depan"), belakang = $("#belakang"), btn = $("#btn-balik"), btnTeks = $("#balik-teks");
  let sudut = 0, pernah = false;
  const diBelakang = () => ((Math.round(sudut / 180) % 2) + 2) % 2 === 1;
  function ulang(el, kelas) {
    if (!el) return;
    el.classList.remove("lompat", "intai", "kilas");
    void el.offsetWidth;
    el.classList.add(kelas);
  }
  function tetapkan(animasi) {
    putar.style.setProperty("--sudut", sudut + "deg");
    const b = diBelakang();
    belakang.inert = !b; depan.inert = b;
    belakang.setAttribute("aria-hidden", String(!b));
    depan.setAttribute("aria-hidden", String(b));
    $$("a, button", belakang).forEach((x) => { x.tabIndex = b ? 0 : -1; });
    if (btn) btn.setAttribute("aria-pressed", String(b));
    if (btnTeks) btnTeks.textContent = b ? (K.teksDepan || "Ketuk kad untuk kembali ke depan") : (K.teksBelakang || "Ketuk kad untuk lihat butiran");
    root.classList.toggle("di-belakang", b);
    if (animasi && !kurang) {
      ulang(angkat, "lompat"); ulang(bayang, "lompat");
      $$(".kilap").forEach((k) => ulang(k, "kilas"));
    }
  }
  function terbalik(arah) {
    pernah = true;
    sudut = Math.round(sudut / 180) * 180 + 180 * (arah || -1);
    tetapkan(true);
  }
  if (btn) btn.addEventListener("click", () => terbalik(-1));

  /* tap to flip, or drag sideways and let go (like turning a real card) */
  let tekan = null;
  kad.addEventListener("pointerdown", (e) => {
    if (e.button > 0 || e.target.closest("a, button")) return;
    tekan = { x: e.clientX, y: e.clientY, id: e.pointerId, seret: false, asal: Math.round(sudut / 180) * 180 };
  });
  kad.addEventListener("pointermove", (e) => {
    if (!tekan || e.pointerId !== tekan.id) return;
    const dx = e.clientX - tekan.x;
    if (!tekan.seret && Math.abs(dx) > 8) {
      tekan.seret = true; pernah = true;
      try { kad.setPointerCapture(e.pointerId); } catch (_) {}
      angkat.classList.remove("intai");
      putar.classList.add("seret");
    }
    if (tekan.seret) {
      const deg = tekan.asal + Math.max(-179, Math.min(179, dx * 0.6));

    if (!tekan || e.pointerId !== tekan.id) return;
    const t = tekan; tekan = null;
    putar.classList.remove("seret");
    const dx = e.clientX - t.x, dy = e.clientY - t.y;
    if (t.seret) {
      sudut = Math.abs(dx * 0.6) > 50 ? t.asal + (dx > 0 ? 180 : -180) : t.asal;
      tetapkan(sudut !== t.asal);

      terbalik(-1);
    }

  kad.addEventListener("pointercancel", lepas);
  kad.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === kad) { e.preventDefault(); terbalik(-1); } });

  /* ---------- 4. keep long names and addresses inside the card ---------- */
  /* One pass: names shrink to their width, text boxes shrink (down to the reading floors set in CSS).
     Returns false when something still doesn't fit. */
  function muatSekali() {
    let ok = true;
    $$("[data-muat-nama]").forEach((isi) => {
      isi.style.setProperty("--sn", 1);
      const lebar = isi.clientWidth;
      const w = Math.max(1, ...$$(".n", isi).map((n) => n.offsetWidth));
      let sn = 1;
      if (lebar > 0 && w > lebar) sn = Math.max(0.45, (lebar / w) * 0.97);
      isi.style.setProperty("--sn", sn.toFixed(3));
      /* the front's text block (data-muat-depan) must also fit in height */
      const blok = isi.hasAttribute("data-lebar-sahaja") ? null : isi.closest("[data-muat-depan]");
      for (let i = 0; blok && i < 14 && blok.clientHeight > 0 && blok.scrollHeight > blok.clientHeight + 2 && sn > 0.45; i++) {
        sn -= 0.04; isi.style.setProperty("--sn", sn.toFixed(3));
      }
      if (blok && blok.clientHeight > 0 && blok.scrollHeight > blok.clientHeight + 2) ok = false;

      const dalam = $(".muat", kotak) || kotak.firstElementChild;

      let s = 1; kotak.style.setProperty("--s", 1);
      for (let i = 0; i < 28 && kotak.clientHeight > 0 && dalam.offsetHeight > kotak.clientHeight && s > 0.42; i++) {
        s -= 0.025; kotak.style.setProperty("--s", s.toFixed(3));

  function muat() {
    const pentas = $(".pentas");
    root.classList.remove("qw-tatal");
    if (kad) kad.style.removeProperty("--tambah");

    if (!ok && kad) {
      root.classList.add("qw-tatal");
      if (pentas) pentas.style.paddingBottom = "";
      ok = muatSekali();
      for (let t = 0.05; !ok && t < 0.51; t += 0.05) {

  function tengah() {

    pentas.style.paddingBottom = "";
    if (root.classList.contains("qw-tatal") || matchMedia("(orientation: landscape) and (max-height: 520px)").matches) return;
    const lebih = kaw.clientHeight - kad.offsetHeight * 1.06;
    if (lebih > 8) pentas.style.paddingBottom = (16 + lebih / 2) + "px";

  function semua() {

  let tunda;
  window.addEventListener("resize", () => { clearTimeout(tunda); tunda = setTimeout(semua, 140); });

  /* a small peek so guests know the card turns */
  setTimeout(() => { if (!pernah && !kurang && sudut === 0) ulang(angkat, "intai"); }, 1600);

  /* ---------- 5. showroom: colour picker + messages from a parent page ---------- */
  if (typeof DEMO !== "undefined" && DEMO && WARNA.length > 1) {
    const w = $("#warna");
    if (w) {
      w.hidden = false;
      w.insertAdjacentHTML("beforeend", WARNA.map((x) =>
        `<button type="button" data-warna="${x.key}" aria-label="${x.nama}" title="${x.nama}" style="--sw-a:${x.sw[0]};--sw-b:${x.sw[1]}"></button>`).join(""));
      w.addEventListener("click", (e) => { const b = e.target.closest("button[data-warna]"); if (b) setWarna(b.dataset.warna); });
      setWarna(warnaKini, true);
    }
  }
  window.addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.qwWarna) setWarna(d.qwWarna);
    if (d.qwBalik === true && !diBelakang()) terbalik(-1);
    if (d.qwBalik === false && diBelakang()) terbalik(1);
  });
  window.QW_FLIP = { setWarna, terbalik, warna: () => warnaKini, diBelakang, muat };
})();
