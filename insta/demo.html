<style>
:root {
  color-scheme: light;
  --bg: #FBF8F4; --kad: #FFFFFF; --ink: #221A24; --muted: #6B6270; --line: #EAE3E8;
  --accent: #5A2150; --tint: #F3E8F0; --emas: #C8A350; --merah: #D6455D;
  --f-d: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-b: "Hanken Grotesk", "Helvetica Neue", system-ui, sans-serif;
  --f-s: "Playfair Display", Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-b); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { max-width: 480px; margin-inline: auto; min-height: 100vh; background: var(--bg); padding-bottom: 90px; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: rgba(251, 248, 244, .94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar svg.q { width: 24px; height: 24px; color: var(--accent); }
.bar b { font: 800 17px/1 var(--f-d); letter-spacing: -.03em; }
.bar .langsung { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--merah); }
.bar .langsung::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--merah); animation: denyut 1.6s ease-in-out infinite; }
@keyframes denyut { 50% { opacity: .3; } }

.profil { display: grid; justify-items: center; gap: 6px; padding: 22px 16px 16px; text-align: center; }
.cincin { width: 92px; height: 92px; border-radius: 50%; padding: 3px; background: conic-gradient(from 200deg, var(--emas), #E9A6C6, var(--accent), var(--emas)); }
.cincin span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg); background: var(--tint); color: var(--accent); font: italic 30px/1 var(--f-s); }
.nama { font: italic 30px/1.15 var(--f-s); margin: 6px 0 0; }
.tarikh { color: var(--muted); font-size: 13.5px; }
.stat { display: flex; gap: 22px; margin: 8px 0 4px; }
.stat div { display: grid; }
.stat b { font: 800 18px/1.2 var(--f-d); }
.stat span { font-size: 12px; color: var(--muted); }
.aksi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 8px; }
.btn { min-height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--kad); font-weight: 700; font-size: 14px; }
.btn.utama { background: var(--accent); border-color: var(--accent); color: #fff; }

.sorotan { display: flex; gap: 14px; overflow-x: auto; padding: 4px 16px 14px; scrollbar-width: none; }
.sorotan::-webkit-scrollbar { display: none; }
.sorotan figure { margin: 0; display: grid; justify-items: center; gap: 5px; flex: none; }
.sorotan .b { width: 62px; height: 62px; border-radius: 50%; overflow: hidden; border: 2px solid var(--line); }
.sorotan figcaption { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.b svg, .media svg, .grid svg { display: block; width: 100%; height: 100%; }

.tabs { position: sticky; top: 49px; z-index: 4; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs button { min-height: 44px; border: 0; background: none; font-weight: 700; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

.pos { background: var(--kad); border-bottom: 1px solid var(--line); }
.pos-atas { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; flex: none; }
.pos-atas b { display: block; font-size: 14px; line-height: 1.2; }
.pos-atas small { color: var(--muted); font-size: 12px; }
.lencana { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: var(--tint); color: var(--accent); font-size: 11px; font-weight: 700; }
.lencana svg { width: 12px; height: 12px; }
.media { position: relative; aspect-ratio: 1; background: #eee; }
.media .main { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(0, 0, 0, .45); display: grid; place-items: center; }
.media .main svg { width: 24px; height: 24px; margin-left: 3px; }
.media .masa { position: absolute; right: 10px; bottom: 10px; padding: 2px 8px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 12px; font-weight: 700; }
.pos-bawah { display: flex; align-items: center; gap: 16px; padding: 10px 14px 4px; }
.suka, .komen { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; font-weight: 700; font-size: 14px; }
.suka svg, .komen svg { width: 24px; height: 24px; }
.suka[aria-pressed="true"] { color: var(--merah); }
.suka[aria-pressed="true"] svg path { fill: var(--merah); stroke: var(--merah); }
.suka.pop svg { animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.3); } }
.kapsyen { padding: 2px 14px 14px; font-size: 14px; }
.kapsyen b { margin-right: 6px; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.grid div { aspect-ratio: 1; }

.ucapan { display: grid; gap: 10px; padding: 14px; }
.ucapan article { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 14px; border-radius: 14px; background: var(--kad); border: 1px solid var(--line); }
.ucapan b { font-size: 14px; }
.ucapan p { margin: 2px 0 0; font-size: 14px; }
.ucapan small { color: var(--muted); font-size: 12px; }

.fab { position: fixed; right: max(18px, calc(50% - 240px + 18px)); bottom: 22px; z-index: 6; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(90, 33, 80, .4); }
.fab svg { width: 26px; height: 26px; }
.kaki { padding: 20px 16px; text-align: center; color: var(--muted); font-size: 12.5px; }
.kaki b { color: var(--accent); font-family: var(--f-d); letter-spacing: -.02em; }

.helaian { position: fixed; inset: 0; z-index: 10; display: grid; align-items: end; background: rgba(20, 10, 20, .45); }
.helaian-isi { width: 100%; max-width: 480px; margin-inline: auto; display: grid; gap: 12px; padding: 16px 16px 24px; border-radius: 22px 22px 0 0; background: var(--kad); animation: naik .28s ease; }
@keyframes naik { from { transform: translateY(40px); opacity: 0; } }
.helaian-isi .pemegang { justify-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
.helaian-isi h2 { margin: 0; font: 800 20px/1.2 var(--f-d); letter-spacing: -.02em; }
.pilihan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pilihan button { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 700; }
.pilihan svg { width: 24px; height: 24px; color: var(--accent); }
.segmen { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 12px; background: var(--bg); }
.segmen button { min-height: 38px; border: 0; border-radius: 9px; background: none; font-size: 13px; font-weight: 700; color: var(--muted); }
.segmen button[aria-pressed="true"] { background: var(--kad); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.helaian-isi input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font: inherit; font-size: 16px; }
.roti { position: fixed; left: 50%; bottom: 96px; z-index: 12; transform: translateX(-50%); width: min(90%, 420px); padding: 12px 14px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 13.5px; text-align: center; }
svg.ik { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>

(function () {
  "use strict";
  const C = CONFIG, $ = (s) => document.querySelector(s);
  const A = C.anak.panggilan, B = C.pasangan.panggilan;
  const HARI = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
  const BULAN = ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai", "Ogos", "September", "Oktober", "November", "Disember"];
  const [y, m, d] = C.mula.slice(0, 10).split("-").map(Number);

  $("#monogram").textContent = `${A.charAt(0)}&${B.charAt(0)}`;
  $("#tarikh").textContent = `${HARI[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}, ${d} ${BULAN[m - 1]} ${y}`;
  document.title = `InstaWedding ${A} & ${B}`;

  /* ---- illustrated sample "photos", drawn in code ---- */
  const orang = (x, y, baju, tudung, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-9 30 -6 8Q0 3 6 8L9 30Z" fill="${baju}"/>

  const lelaki = (x, y, baju, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-9 30 -7 8Q0 4 7 8L9 30Z" fill="${baju}"/><path d="M-9 30-7 22 7 22 9 30Z" fill="#E3C27A" opacity=".85"/>

  const SCENE = {
    pelamin: (h) => `<defs><linearGradient id="g${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6DCCB"/><stop offset="1" stop-color="#E7B4A6"/></linearGradient></defs>
      <rect width="100" height="100" fill="url(#g${h})"/>
      <path d="M18 100V46Q18 16 50 12Q82 16 82 46V100" fill="#FBEFE6" stroke="#C8A350" stroke-width="2"/>
      ${[20, 32, 44, 56, 68, 80].map((x, i) => `<circle cx="${x}" cy="${20 + Math.abs(50 - x) * .55}" r="${4 + (i % 2)}" fill="${i % 2 ? "#F2A7B8" : "#FFFFFF"}"/>`).join("")}
      <rect x="28" y="62" width="44" height="6" rx="3" fill="#C8A350"/>
      ${orang(42, 56, "#FFF8EE", "#F4EDE2", 1.05)}${lelaki(58, 55, "#FFF8EE", 1.05)}

      <circle cx="46" cy="52" r="30" fill="#fff"/><circle cx="46" cy="52" r="25" fill="#F7F1E7"/>
      <path d="M28 54Q30 36 46 34Q62 36 64 54Z" fill="#F0C75E"/><path d="M34 50q4-8 12-9" stroke="#fff" stroke-width="1.4" fill="none" opacity=".7"/>
      <circle cx="54" cy="60" r="7" fill="#B8412F"/><circle cx="38" cy="62" r="5" fill="#6F9C4B"/>
      <circle cx="84" cy="22" r="11" fill="#fff"/><circle cx="84" cy="22" r="8" fill="#C0492F"/>

    manggar: (h) => `<rect width="100" height="100" fill="#1F5A5E"/>
      ${Array.from({ length: 9 }, (_, i) => { const a = (-150 + i * 15) * Math.PI / 180, x = 50 + Math.cos(a) * 46, y = 96 + Math.sin(a) * 80;
        return `<path d="M50 96Q${(50 + x) / 2 + 6} ${(96 + y) / 2} ${x.toFixed(1)} ${y.toFixed(1)}" stroke="#E7D7A6" stroke-width="1.2" fill="none"/>
          ${[0.45, .7, 1].map((t, j) => `<circle cx="${(50 + (x - 50) * t).toFixed(1)}" cy="${(96 + (y - 96) * t).toFixed(1)}" r="${2.6 + j}" fill="${["#F2B233", "#F07A8C", "#FFFFFF", "#C8A350"][(i + j) % 4]}"/>`).join("")}`; }).join("")}`,
    cincin: (h) => `<defs><radialGradient id="r${h}" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FCEFF3"/><stop offset="1" stop-color="#E6C3CF"/></radialGradient></defs>

  const POS = [
    { n: "Farah", t: "2 minit lalu", s: "pelamin", k: `Pelamin paling cantik tahun ini. Tahniah ${A} & ${B}!`, suka: 48, komen: 6 },

    { n: "Mak Long Ani", t: "12 minit lalu", s: "cincin", k: `Untuk simpanan pengantin. Semoga bahagia hingga ke jannah, ${A}.`, suka: 12, komen: 1, peribadi: true },
    { n: "Hafiz", t: "18 minit lalu", s: "hidangan", k: "Nasi minyak Mak Long memang juara.", suka: 27, komen: 9 },
    { n: "Zul", t: "25 minit lalu", s: "manggar", k: "Bunga manggar dari kampung, dibuat tangan.", suka: 19, komen: 2 }
  ];
  const hati = '<svg class="ik" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 3c0 5.4-7.5 10-7.5 10z"/></svg>';
  const komen = '<svg class="ik" viewBox="0 0 24 24"><path d="M4.6 19.4l1.1-3.5a7.6 7.6 0 1 1 2.7 2.4z"/></svg>';
  const kunci = '<svg class="ik" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  $("#p-suapan").innerHTML = POS.map((p, i) => `<article class="pos">
      <div class="pos-atas"><span class="av" style="background:${WARNA[i % WARNA.length]}">${p.n.charAt(0)}</span><div><b>${p.n}</b><small>${p.t}</small></div>
        ${p.peribadi ? `<span class="lencana">${kunci}Pengantin sahaja</span>` : ""}</div>
      <div class="media">${gambar(p.s, "p" + i)}${p.video ? `<span class="main"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="#fff"/></svg></span><span class="masa">${p.video}</span>` : ""}</div>
      <div class="pos-bawah"><button class="suka" type="button" aria-pressed="false" data-n="${p.suka}" aria-label="Suka">${hati}<span>${p.suka}</span></button>
        <span class="komen">${komen}${p.komen}</span></div>
      <p class="kapsyen"><b>${p.n}</b>${p.k}</p></article>`).join("");

  const SEMUA = ["pelamin", "hidangan", "tetamu", "cincin", "manggar", "kek", "telur", "pelamin", "tetamu", "hidangan", "kek", "cincin"];
  $("#p-galeri").innerHTML = SEMUA.map((s, i) => `<div>${gambar(s, "g" + i)}</div>`).join("");

  const UCAPAN = [
    ["Pak Ngah Din", "Barakallahu lakuma. Jaga satu sama lain baik-baik.", "1 minit lalu"],
    ["Aunty Mei Ling", `Congratulations ${A} and ${B}! Wishing you a lifetime of happiness.`, "4 minit lalu"],
    ["Farah", "Tahniah kawanku! Semoga bahagia selalu.", "9 minit lalu"],
    ["Cikgu Rahimah", "Semoga menjadi keluarga yang sakinah, mawaddah dan rahmah.", "15 minit lalu"]
  ];
  $("#p-ucapan").innerHTML = UCAPAN.map(([n, u, t], i) => `<article><span class="av" style="background:${WARNA[(i + 2) % WARNA.length]}">${n.charAt(0)}</span>
    <div><b>${n}</b><p>${u}</p><small>${t}</small></div></article>`).join("");

  /* ---- interactions ---- */
  document.addEventListener("click", (e) => {
    const suka = e.target.closest(".suka");
    if (suka) {
      const on = suka.getAttribute("aria-pressed") !== "true";
      suka.setAttribute("aria-pressed", String(on));
      suka.querySelector("span").textContent = +suka.dataset.n + (on ? 1 : 0);
      suka.classList.remove("pop"); void suka.offsetWidth; suka.classList.add("pop");
      return;
    }
    const tab = e.target.closest("[data-tab]");
    if (tab) {
      const id = tab.dataset.tab;
      document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
      ["suapan", "galeri", "ucapan"].forEach((k) => { $("#p-" + k).hidden = k !== id; });
      if (tab.closest(".aksi")) document.querySelector(".tabs").scrollIntoView({ behavior: "smooth" });
      return;
    }
    if (e.target.closest("[data-buka]")) { $("#helaian").hidden = false; return; }
    if (e.target.id === "helaian") { $("#helaian").hidden = true; return; }
    const siapa = e.target.closest("[data-siapa]");
    if (siapa) { document.querySelectorAll("[data-siapa]").forEach((b) => b.setAttribute("aria-pressed", String(b === siapa))); return; }
    if (e.target.closest("[data-cuba]")) {
      $("#helaian").hidden = true;
      const r = $("#roti");
      r.textContent = "Ini contoh. Pada hari majlis, gambar dan ucapan tetamu akan muncul di sini.";
      r.hidden = false;
      clearTimeout(r._t); r._t = setTimeout(() => { r.hidden = true; }, 2600);
    }
  });
})();
</script>
</body>
</html>
